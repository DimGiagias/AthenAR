<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>AR Target Compiler</title>
        <style>
            :root { color-scheme: light; }
            body { margin: 0; padding: 24px 16px; font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; }
            main { max-width: 760px; margin: 0 auto; }
            h1 { font-size: 22px; margin: 0 0 6px; }
            p { font-size: 14px; line-height: 1.5; color: #475569; }
            code { background: #e2e8f0; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
            ol { padding: 0; list-style: none; display: grid; gap: 10px; }
            li { display: flex; gap: 12px; align-items: center; background: #fff; border: 1px solid #bae6fd; border-radius: 12px; padding: 10px; font-size: 13px; }
            li img { width: 84px; height: 84px; object-fit: contain; background: #f1f5f9; border-radius: 8px; }
            .bad { color: #b45309; font-weight: bold; }
            button { font: inherit; font-weight: bold; font-size: 14px; padding: 10px 16px; border-radius: 10px; border: 0; background: #0284c7; color: #fff; cursor: pointer; }
            button:disabled { background: #94a3b8; cursor: default; }
            progress { width: 100%; height: 10px; margin-top: 12px; }
            #status { font-weight: bold; color: #0369a1; }
        </style>
    </head>
    <body>
        <main>
            <h1>AR target compiler</h1>
            <p>
                Makes the file the image tracker reads, from the images listed in <code>src/data/arTargets.ts</code>, in that order. Runs only under
                <code>npm run dev</code>.
            </p>
            <p>After compiling, save the downloaded <code>targets.mind</code> as <code>public/ar/targets.mind</code>, replacing the old one.</p>
            <ol id="list"></ol>
            <button id="compile" type="button">Compile targets</button>
            <progress id="progress" max="100" value="0" hidden></progress>
            <p id="status"></p>
        </main>
        <script type="module" src="./ar-targets.ts"></script>
    </body>
</html>
